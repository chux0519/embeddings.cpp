# Builds standalone embeddings_server binaries (ggml and the tokenizer linked
# statically) and, for a v* tag, publishes them as a GitHub release:
# - embeddings_server-<os>-<arch>[.exe]
# - SHA256SUMS, LICENSE
# Run it by hand to get the binaries as workflow artifacts without a release.
# Tags with a pre-release suffix (v0.2.0-rc.1) publish pre-releases.
name: Release Server Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64: AVX2/FMA/F16C (Haswell and newer). 22.04: glibc 2.35.
          - { runner: ubuntu-22.04, os: linux, arch: amd64, flags: "", ldflags: "-static-libstdc++ -static-libgcc" }
          # arm64: ARMv8.2 with dot product (Graviton2, Ampere, Raspberry Pi 5).
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64, flags: "-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod", ldflags: "-static-libstdc++ -static-libgcc" }
          # Apple silicon, Metal with the shader library embedded.
          - { runner: macos-14, os: darwin, arch: arm64, flags: "-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON" }
          - { runner: windows-2022, os: windows, arch: amd64, flags: "" }
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Version
        id: version
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
          v[0-9]*) version="${GITHUB_REF_NAME#v}" ;;
          *) version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' embeddings_cpp/__init__.py)-dev+${GITHUB_SHA::7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          LDFLAGS: ${{ matrix.ldflags }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DEMBEDDINGS_CPP_VERSION="${{ steps.version.outputs.version }}" \
            ${{ matrix.flags }}
          cmake --build build --config Release --target embeddings_server -j 4
          ext=; [ "${{ matrix.os }}" = windows ] && ext=.exe
          bin="$(find build -name "embeddings_server$ext" -type f | head -1)"
          mkdir -p dist
          cp "$bin" "dist/embeddings_server-${{ matrix.os }}-${{ matrix.arch }}$ext"
          [ "${{ matrix.os }}" = windows ] || strip "dist/embeddings_server-${{ matrix.os }}-${{ matrix.arch }}"
          ls -l dist

      - name: Check
        shell: bash
        run: |
          bin="$(ls dist/embeddings_server-*)"
          case "${{ matrix.os }}" in
          linux) ldd "$bin" ;;
          darwin) otool -L "$bin" ;;
          esac
          got="$("$bin" --version)"
          echo "$got"
          [ "$got" = "embeddings_server ${{ steps.version.outputs.version }}" ]

      - uses: actions/cache@v4
        with:
          path: smoke-model
          key: bge-m3.q4_k_mlp_emb_q8_attn

      - name: Smoke test
        shell: bash
        run: |
          model=smoke-model/bge-m3.q4_k_mlp_emb_q8_attn.gguf
          [ -f "$model" ] || curl -fsSL --create-dirs -o "$model" \
            https://huggingface.co/chux0519/bge-m3-gguf-embeddings-cpp/resolve/main/bge-m3.q4_k_mlp_emb_q8_attn.gguf
          "$(ls dist/embeddings_server-*)" --model "$model" --port 18090 --max-tokens 512 > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:18090/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18090/v1/embeddings -H "Content-Type: application/json" \
            -d '{"input":["slow login after the auth change"]}' -o resp.json || { cat server.log; exit 1; }
          "$(command -v python3 || command -v python)" -c 'import json; d = json.load(open("resp.json"))["data"][0]["embedding"]; print(len(d), d[:3]); assert len(d) == 1024'
          kill $pid

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          mkdir -p dist
          cp artifacts/* LICENSE dist/
          chmod +x dist/embeddings_server-*
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=
          case "$GITHUB_REF_NAME" in *-*) flags=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "embeddings.cpp $GITHUB_REF_NAME" $flags
